name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: v5.11.2
          target: Android64
      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: ${{ steps.build.outputs.build-output }}
